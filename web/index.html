<!DOCTYPE html>

  <link rel="apple-touch-icon" href="/static/icon.png" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],

          colors: {
            brand: {
              DEFAULT: '#bd2333',
              dark: '#9e1b29',
              light: '#fdf2f3',
              soft: '#fce8ea',
            }
          }
        }
      }
    };

<body class="min-h-screen flex flex-col bg-[#f8f9fa] text-gray-900 selection:bg-[#bd2333]/15 selection:text-[#bd2333]">

  <!-- Non-blocking Toast Banner (Replaces alert/confirm) -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-sm px-4"></div>

  <!-- Main Responsive Layout Wrapper -->
  <div class="flex-1 w-full max-w-6xl mx-auto flex flex-col lg:flex-row lg:items-start lg:justify-center lg:gap-8 lg:py-6 lg:px-6">

    <!-- Mobile-First Primary App Shell -->
    <main id="app-shell" class="w-full max-w-md mx-auto lg:mx-0 bg-white min-h-screen lg:min-h-[780px] lg:rounded-3xl lg:shadow-xl lg:border lg:border-gray-200/80 flex flex-col relative overflow-hidden">

      <!-- Top Navigation Header (Hidden on Page 1 Hero, Visible on Pages 2-6) -->
      <header id="app-header" class="hidden sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 py-3">
        <div class="flex items-center justify-between gap-2">
          <button id="back-btn" type="button" onclick="goBack()" aria-label="이전 단계"
            class="p-2 -ml-2 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-gray-100 active:scale-95 transition flex items-center gap-1 text-sm font-semibold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span>이전</span>
          </button>

          <!-- Brand Logo Button (Resets to Page 1) -->
          <button type="button" onclick="resetToStart()" class="flex items-center gap-1.5 group">
            <span class="w-7 h-7 rounded-lg bg-[#bd2333] flex items-center justify-center shadow-sm group-hover:scale-105 transition">
              <!-- Custom Rice-Bowl SVG Icon -->
              <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none">
                <path d="M7 5.5C7 4.5 7.8 4 7.8 3M12 5C12 4 12.8 3.5 12.8 2.5M17 5.5C17 4.5 17.8 4 17.8 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M5 12C5 9.2 8.1 7.5 12 7.5C15.9 7.5 19 9.2 19 12" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M3.5 12H20.5C20.5 16.4 16.9 19.5 12 19.5C7.1 19.5 3.5 16.4 3.5 12Z" fill="currentColor"/>
                <path d="M8.5 19.5H15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="font-extrabold text-base tracking-tight text-gray-900">지금어디가</span>
          </button>

          <!-- Step Indicator Pill -->
          <div id="step-badge" class="px-2.5 py-1 rounded-full bg-[#fdf2f3] text-[#bd2333] text-xs font-bold">
            2 / 6
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full h-1.5 bg-gray-100 rounded-full mt-2.5 overflow-hidden">
          <div id="progress-bar" class="h-full bg-[#bd2333] rounded-full transition-all duration-300" style="width: 33%;"></div>
        </div>
      </header>

      <!-- Dynamic Page Viewport -->
      <div id="page-viewport" class="flex-1 flex flex-col">
        <!-- Rendered dynamically by renderApp() -->
      </div>

    </main>

  </div>
  <script src="/static/v2-landing.js"></script>
  <script src="/static/v2.js"></script>
</body>
</html>
