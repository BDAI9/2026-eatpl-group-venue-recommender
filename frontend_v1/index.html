<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>지금어디가 — 고민은 짧게, 맛있는 결정은 지금 바로</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#bd2333',
              dark: '#991b28',
              light: '#fdf2f3',
              border: '#f7d4d8',
            },
          },
        },
      },
    };
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="min-h-dvh w-full flex items-center justify-center sm:py-6 sm:px-4">

  <!-- Centered Mobile-First App Shell (max-w-[440px]) -->
  <div id="app-shell" class="w-full max-w-[440px] min-h-dvh sm:min-h-0 sm:h-[calc(100dvh-3rem)] sm:max-h-[880px] bg-white sm:rounded-[36px] sm:shadow-[0_24px_64px_-16px_rgba(24,20,18,0.22)] sm:border sm:border-black/[0.06] flex flex-col overflow-hidden relative">

    <!-- Dynamic App Content Mount Point -->
    <main id="app-root" class="flex-1 flex flex-col h-full overflow-hidden relative"></main>

    <!-- Non-Blocking In-App Toast Notification -->
    <div id="app-toast" class="pointer-events-none fixed sm:absolute bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-2">
      <div id="app-toast-text" class="bg-zinc-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap backdrop-blur-sm">
        알림 메시지
      </div>
    </div>

    <!-- Inline Location Quick-Edit Modal (for Page 6 Filter Header) -->
    <div id="location-modal" class="hidden absolute inset-0 z-40 bg-black/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-page-in">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-bold text-zinc-900">지역 변경하기</h3>
          <button type="button" onclick="closeLocationModal()" class="w-8 h-8 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center text-zinc-600 text-sm font-bold" aria-label="닫기">✕</button>
        </div>
        <div class="flex items-center bg-zinc-100 rounded-full p-1.5 pl-4 mb-3 border border-zinc-200 focus-within:border-[#bd2333] focus-within:bg-white transition-colors">
          <input
            id="modal-location-input"
            type="text"
            placeholder="어디에서 먹을까요?"
            class="flex-1 bg-transparent text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none"
            onkeydown="if(event.key==='Enter') applyModalLocation()"
          />
          <button
            type="button"
            onclick="applyModalLocation()"
            class="bg-[#bd2333] hover:bg-[#991b28] text-white text-xs font-semibold px-4 py-2 rounded-full transition-colors shrink-0"
          >
            적용
          </button>
        </div>
        <p class="text-[11px] font-medium text-zinc-400 mb-2">인기 핫플레이스</p>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="selectModalHotspot('을지로')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">을지로</button>
          <button type="button" onclick="selectModalHotspot('성수동')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">성수동</button>
          <button type="button" onclick="selectModalHotspot('강남역')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">강남역</button>
          <button type="button" onclick="selectModalHotspot('홍대입구')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">홍대입구</button>
          <button type="button" onclick="selectModalHotspot('종로·광화문')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">종로·광화문</button>
          <button type="button" onclick="selectModalHotspot('여의도')" class="px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-100 hover:bg-[#fdf2f3] hover:text-[#bd2333] text-zinc-700 transition-colors">여의도</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
